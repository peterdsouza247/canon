name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if it is not already. Without this
          # the first run fails with "Get Pages site failed" and the fix is
          # buried in repository settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The demo is a single self contained page with no build step, so the
          # artefact is simply the folder.
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
